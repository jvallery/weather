# Rendered by scripts/restore-drill.sh; never included in deploy/k8s.
# All resources stay in weather; the read-only reader Secret is referenced
# in place, never exported or copied into a separate namespace.
# Source archive (storage-infra#1253): the availability Garage store that
# weather-pg archives to (weather-pg-local, s3://weather-pg/cnpg), read with the
# gate-created read-only key weather-pg-backup-s3-reader-k3s. The drill has no
# internet egress, so a pass also shows the restore needs no WAN.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: __DRILL_NAME__-reader
  namespace: weather
  labels:
    estate.vallery.net/disposable: 'true'
    estate.vallery.net/expires: '__EXPIRES__'
    weather.vallery.net/restore-drill: '__OPERATION__'
spec:
  configuration:
    destinationPath: s3://weather-pg/cnpg
    endpointURL: http://garage-k3s.garage-k3s.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: weather-pg-backup-s3-reader-k3s
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: weather-pg-backup-s3-reader-k3s
        key: AWS_SECRET_ACCESS_KEY
      # No region selector: the gate writes only the two key fields. Garage checks the
      # SigV4 scope against s3_region `garage`, supplied by the sidecar env below.
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
      maxParallel: 2
  # No retentionPolicy: this store is read-only and must never prune.
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
      - name: AWS_REGION
        value: garage
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: '1', memory: 512Mi}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: __DRILL_NAME__
  namespace: weather
  labels:
    estate.vallery.net/disposable: 'true'
    estate.vallery.net/expires: '__EXPIRES__'
    weather.vallery.net/restore-drill: '__OPERATION__'
spec:
  instances: 1
  imageName: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql-777ad6774e00fff6:16.15@sha256:d66df406385b9f3c43c47e94fe3a0002278ef56d21b82a8c9d3a22f91aa9c3f0
  imagePullSecrets:
    - name: zot-origin-cluster-pull
  enableSuperuserAccess: false
  bootstrap:
    recovery:
      source: weather-production-archive
      recoveryTarget:
        targetTime: '__RECOVERY_TARGET__'
  externalClusters:
    - name: weather-production-archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: __DRILL_NAME__-reader
          serverName: weather-pg
  # Deliberately no spec.plugins: recovery reads the archive but enables no WAL archiver.
  # No managed roles or owner/password rewrite: restored role state is retained.
  storage:
    size: 20Gi
    storageClass: longhorn-v1-rwo
  affinity:
    nodeSelector:
      agentfleet.vallery.net/control-plane: 'false'
      storage.vallery.net/longhorn: 'true'
  inheritedMetadata:
    labels:
      estate.vallery.net/disposable: 'true'
      estate.vallery.net/expires: '__EXPIRES__'
      weather.vallery.net/restore-drill: '__OPERATION__'
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: '1', memory: 2Gi}
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      log_error_verbosity: terse
      log_parameter_max_length: '0'
      log_parameter_max_length_on_error: '0'
      log_statement: none
      log_min_error_statement: panic
      log_min_duration_statement: '-1'
      log_duration: 'off'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: __DRILL_NAME__-isolation
  namespace: weather
  labels:
    estate.vallery.net/disposable: 'true'
    estate.vallery.net/expires: '__EXPIRES__'
    weather.vallery.net/restore-drill: '__OPERATION__'
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: __DRILL_NAME__
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # The availability Garage S3 port only (garage-k3s admits 10.42.0.0/16 on 3900).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage-k3s
          podSelector:
            matchLabels:
              app.kubernetes.io/name: garage-k3s
      ports:
        - {port: 3900, protocol: TCP}
    # The instance manager and plugin sidecar read the API; kube-router matches the
    # post-DNAT server endpoints (precedent: auth/egress-allow-management-auth-pg-kube-api).
    # No 443 and no other destination: the drill has no internet egress.
    - to:
        - ipBlock: {cidr: 192.168.30.31/32}
        - ipBlock: {cidr: 192.168.30.32/32}
        - ipBlock: {cidr: 192.168.30.33/32}
        - ipBlock: {cidr: 192.168.30.240/32}
      ports:
        - {port: 6443, protocol: TCP}
