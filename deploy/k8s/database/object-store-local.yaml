# Retired history store (weather#334). Until 2026-11-28 the WAL archiver and the daily base
# backup of weather-pg went here, to the in-cluster availability Garage bucket weather-pg, which
# runs on Longhorn. Since then weather-pg archives to weather-pg-archive (object-store-archive.yaml,
# NAS-backed) and nothing writes or prunes this store. It stays declared, with its data, so that
# its history can still be restored until the storage owner deletes the bucket after the new
# archive is proven; that deletion is separate and needs the maintainer's approval.
# Credentials: Secret weather-pg-backup-s3-writer-k3s (bucket weather-pg, read/write), minted by
# the Garage provisioning tool on 2026-10-31 and delivered from the secrets/weather bundle.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: weather-pg-local
  namespace: weather
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storage.vallery.net/lifecycle: retired-history
    storage.vallery.net/retired-since: "2026-11-28"
spec:
  configuration:
    destinationPath: s3://weather-pg/cnpg
    endpointURL: http://garage-k3s.garage-k3s.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: weather-pg-backup-s3-writer-k3s
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: weather-pg-backup-s3-writer-k3s
        key: AWS_SECRET_ACCESS_KEY
      # No `region` selector: the gate writes only the two key fields, and Garage's region
      # is not a secret. It comes from the sidecar env below instead.
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
      maxParallel: 2
  # No retentionPolicy: nothing archives here any more, and an empty policy is the only one
  # under which the plugin never prunes the store, so its history is kept as it is.
  instanceSidecarConfiguration:
    # Garage validates the SigV4 credential scope against its s3_region (`garage` on
    # garage-k3s), so a wrong or default region is an auth failure. The plugin only takes a
    # region from a Secret key; boto3 in barman-cloud reads these env vars otherwise. Same
    # shape as the live plugin stores research-vault-postgresql-backup and
    # cortex-rag-postgresql-backup on Garage.
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
      - name: AWS_REGION
        value: garage
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
