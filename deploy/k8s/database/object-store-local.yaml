# Local WAL archive (storage-infra#1253, Wave 2.5 B2; T1 checklist row 7). The WAL archiver
# and the daily base backup go to the availability Garage in the cluster, so archiving keeps
# working with both WANs down and pg_wal never fills. Precedent: auth-pg -> garage-k3s.
# Offsite copy: storage-infra's daily Longhorn B2 backup of the garage-k3s volume (as for
# auth-pg). The B2 store weather-pg-b2 stays declared, unused by the archiver, so its
# history remains restorable until its own provider lifecycle expires it.
# Credentials: Secret weather-pg-backup-s3-writer-k3s (bucket weather-pg, read/write), created
# create-only in the cluster by the agents change-gate Garage target (change-id
# weather-pg-availability-garage-1253); no value is in Git in any form. The keys this store
# selects are attested in weather-pg-backup-credential-contract.yaml.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: weather-pg-local
  namespace: weather
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  configuration:
    destinationPath: s3://weather-pg/cnpg
    endpointURL: http://garage-k3s.garage-k3s.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: weather-pg-backup-s3-writer-k3s
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: weather-pg-backup-s3-writer-k3s
        key: AWS_SECRET_ACCESS_KEY
      # No `region` selector: the gate writes only the two key fields, and Garage's region
      # is not a secret. It comes from the sidecar env below instead.
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
      maxParallel: 2
  # Garage has no provider lifecycle on this bucket: CNPG's policy is the only pruner
  # (a provider rule would break the WAL chain). 7 days covers the T1 >= 7 d runway.
  retentionPolicy: 7d
  instanceSidecarConfiguration:
    # Garage validates the SigV4 credential scope against its s3_region (`garage` on
    # garage-k3s), so a wrong or default region is an auth failure. The plugin only takes a
    # region from a Secret key; boto3 in barman-cloud reads these env vars otherwise. Same
    # shape as the live plugin stores research-vault-postgresql-backup and
    # cortex-rag-postgresql-backup on Garage.
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
      - name: AWS_REGION
        value: garage
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
