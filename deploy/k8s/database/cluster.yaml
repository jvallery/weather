apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: weather-pg
  namespace: weather
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 3
  imageName: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql-777ad6774e00fff6:16.15@sha256:d66df406385b9f3c43c47e94fe3a0002278ef56d21b82a8c9d3a22f91aa9c3f0
  imagePullSecrets:
    - name: zot-origin-cluster-pull
  enableSuperuserAccess: false
  enablePDB: true
  primaryUpdateStrategy: unsupervised
  minSyncReplicas: 1
  maxSyncReplicas: 1
  bootstrap:
    initdb:
      database: weather
      owner: weather_migrator
      secret:
        name: weather-pg-migrator
      postInitApplicationSQL:
        - CREATE EXTENSION vector
  managed:
    roles:
      - name: weather_ingest
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: weather-pg-ingest
      - name: weather_worker
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: weather-pg-worker
      - name: weather_api
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        connectionLimit: 40
        passwordSecret:
          name: weather-pg-api
      - name: weather_editor
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: weather-pg-editor
  storage:
    size: 20Gi
    storageClass: longhorn-v1-rwo
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.vallery.net/proxmox-host
    nodeSelector:
      agentfleet.vallery.net/control-plane: 'false'
      storage.vallery.net/longhorn: 'true'
  # Sized like the options-pg pattern (C15); grow from observed working sets.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '1'
      memory: 2Gi
  inheritedMetadata:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    labels:
      app.kubernetes.io/part-of: weather
  postgresql:
    parameters:
      archive_timeout: 300s
      synchronous_commit: 'on'
      wal_keep_size: 1GB
      max_wal_size: 4GB
      max_connections: '120'
      # Duplicate-key DETAIL and bind parameters can contain private identifiers.
      # Keep generic error/SQLSTATE diagnostics, never packet values or SQL text.
      log_error_verbosity: terse
      log_parameter_max_length: '0'
      log_parameter_max_length_on_error: '0'
      log_statement: none
      log_min_error_statement: panic
      log_min_duration_statement: '-1'
      log_duration: 'off'
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: weather-pg-b2
        serverName: weather-pg
