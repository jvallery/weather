apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: weather-pg
  namespace: weather
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # The client-side diff reports a perpetual OutOfSync on this Cluster while
    # `kubectl diff --server-side` shows no drift; compare server-side instead.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  instances: 3
  imageName: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-postgresql:16.16-standard-trixie-29d173bc84f5@sha256:29d173bc84f5522171f6254b41b8c11d33e218ac073daec7c0d93694b01bbb02
  imagePullSecrets:
    - name: zot-origin-cluster-pull
  enableSuperuserAccess: false
  enablePDB: true
  primaryUpdateStrategy: unsupervised
  # estate-platform#294: a rollout that reaches the primary switches over to an
  # updated replica instead of restarting it in place (smart shutdown held auth-pg writes ~3-4 min). Not part of
  # the pod spec, so it rolls no instance.
  primaryUpdateMethod: switchover
  # The database serving the public site runs at estate-production (weather#224).
  # Changing this rolls all 3 instances (replicas first, then one switchover). The app auto-syncs
  # main, so take a fresh on-demand Backup before merging a change to it.
  priorityClassName: estate-production
  minSyncReplicas: 1
  maxSyncReplicas: 1
  # Estate CNPG default for quorum-sync clusters (the operator is owned by
  # jvallery/estate-platform): the primary
  # isolation check is off. In CNPG 1.30 it kills a primary when one API GET
  # misses a hard-coded 500 ms AND any member is unreachable, so a planned
  # worker stop plus API latency failed over cortex-rag on 2026-11-05. With
  # minSyncReplicas 1 an isolated primary cannot commit, so RPO 0 holds
  # without it. The check is read at probe time: changing it rolls nothing.
  probes:
    liveness:
      isolationCheck:
        enabled: false
        requestTimeout: 1000
        connectionTimeout: 1000
  bootstrap:
    initdb:
      database: weather
      owner: weather_migrator
      secret:
        name: weather-pg-migrator
      postInitApplicationSQL:
        - CREATE EXTENSION vector
  managed:
    roles:
      - name: weather_ingest
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: weather-pg-ingest
      - name: weather_worker
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: weather-pg-worker
      - name: weather_api
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: 40
        passwordSecret:
          name: weather-pg-api
      - name: weather_editor
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: weather-pg-editor
  storage:
    size: 20Gi
    storageClass: longhorn-v1-rwo
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.vallery.net/proxmox-host
    nodeSelector:
      agentfleet.vallery.net/control-plane: 'false'
      storage.vallery.net/longhorn: 'true'
  # The CPU request is sized to the busiest instance's measured use. On 2026-11-05 the primary
  # ran at 7d p95 1.94 cores (max 2.54), so the request was 2. By 2026-11-18 (weather#285,
  # capacity ledger S5) the 7d p95 was 0.67 cores, p99 0.91, max 1.90 on the busiest
  # instance, so the request is 1. CNPG applies one resource spec to every instance. The
  # 4-core limit still covers bursts from concurrent aggregate reads, and the memory bound is
  # unchanged. This trim funds the pipeline raise in deploy/k8s/pipeline/deployments.yaml.
  resources:
    requests:
      cpu: '1'
      memory: 1Gi
    limits:
      cpu: '4'
      memory: 2Gi
  inheritedMetadata:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    labels:
      app.kubernetes.io/part-of: weather
  postgresql:
    parameters:
      archive_timeout: 300s
      synchronous_commit: 'on'
      wal_keep_size: 1GB
      max_wal_size: 4GB
      # Bound WAL kept by replication slots (jvallery/agents#5375): 5GB = min(25% of the
      # 20Gi PVC, 50% of the smallest member's free 19.3GB on 2026-10-30). Reload only.
      max_slot_wal_keep_size: 5GB
      max_connections: '120'
      # JIT compiles the public views' security-barrier plans on every read (1.4 s of a 1.5 s
      # stills query, measured 2026-10-27); this OLTP workload never amortizes it.
      jit: 'off'
      # Duplicate-key DETAIL and bind parameters can contain private identifiers.
      # Keep generic error/SQLSTATE diagnostics, never packet values or SQL text.
      log_error_verbosity: terse
      log_parameter_max_length: '0'
      log_parameter_max_length_on_error: '0'
      log_statement: none
      log_min_error_statement: panic
      log_min_duration_statement: '-1'
      log_duration: 'off'
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        # storage-infra#1253: archive to the in-cluster Garage (works with no WAN).
        barmanObjectName: weather-pg-local
        serverName: weather-pg
        # Canary of the upstream barman-cloud v0.16.0 sidecar on weather-pg only (zot mirror of
        # c669259e). Redundant once the plugin default is that version; removing it then rolls nothing.
        sidecarImage: registry.vallery.net/jvallery/mirror-ghcr-io-cloudnative-pg-plugin-barman-cloud-sidecar:v0.16.0-c669259e20ed@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
