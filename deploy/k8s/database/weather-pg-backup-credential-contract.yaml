    namespace: weather
    bucket: weather-pg
    consumed_by: deploy/k8s/database/object-store-local.yaml
    keys:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    uid: 938194ab-1f1b-44a5-a633-04459926030f
    observed_at: "2026-10-31T10:41:51Z"
  - secret: weather-pg-backup-s3-reader-k3s
    namespace: weather
    bucket: weather-pg
    consumed_by: none
    keys:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
