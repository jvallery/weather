# weather-pg local WAL archive credential contract (storage-infra#1253; precedent: the fleet
# control-plane auth-pg-backup-credential-contract.yaml).
#
# NOT A KUBERNETES MANIFEST. It has no apiVersion/kind and is absent from kustomization.yaml;
# app/tests/test_database_credential_contract.py asserts both. It is read by that test and by
# operators only.
#
# The two Garage credentials for bucket `weather-pg` are created directly in the cluster by
# the agents change-gate Garage target, which never emits key material. CI holds no cluster
# credential, so it cannot see whether the Secret that object-store-local.yaml selects exists
# or carries the keys it selects. Those facts are recorded here, dated, with the read-only
# probe that produced them, and the test refuses a store that selects a Secret or key this
# file does not attest. This is an ATTESTATION, not a proof.
#
# NEVER put a key VALUE in this file. Names, key names, UIDs, labels and dates only.
#
# HOW TO REFRESH THE OBSERVATION (read-only, value-blind)
#   for s in weather-pg-backup-s3-writer-k3s weather-pg-backup-s3-reader-k3s; do
#     kubectl --context vallery-api-vip -n weather get secret "$s" -o go-template=\
#   '{{.metadata.name}} uid={{.metadata.uid}}{{"\n"}}keys: {{range $k,$v := .data}}{{$k}} {{end}}
#   labels: {{range $k,$v := .metadata.labels}}{{$k}}={{$v}} {{end}}
#   annotation-names: {{range $k,$v := .metadata.annotations}}{{$k}} {{end}}(end){{"\n"}}'
#   done
# RANGE ONLY. Never `index`, `len`, `-o yaml`, `-o json` or `jsonpath='{.data}'`: a template
# evaluation error makes kubectl print the whole object, data included.

version: 1

# None known. The keys were minted inside the Garage pod and streamed into create-only
# Secrets; the gate run printed no value.
exposures: []

# The region is not a credential and does not come from the Secret: the gate writes only the
# two key fields. object-store-local.yaml supplies it through
# instanceSidecarConfiguration.env (AWS_DEFAULT_REGION and AWS_REGION), the shape the live
# plugin stores research-vault-postgresql-backup and cortex-rag-postgresql-backup use.
region:
  value: garage
  source: object-store-local.yaml spec.instanceSidecarConfiguration.env
  determined_at: "2026-10-31T10:41:00Z"
  method: garage-config-readback
  # Prints the one s3_region line only; never print the whole garage.toml.
  probe: >-
    kubectl --context vallery-api-vip -n garage-k3s get configmap garage-k3s
    -o jsonpath='{.data.garage\.toml}' | grep -E '^[[:space:]]*s3_region'
  expected_output: s3_region = "garage"
  # The fleet control-plane auth-pg contract established the same value against garage-k3s
  # on 2026-10-13 with the credential-free sigv4-scope-rejection method.
  corroborated_by: auth-pg-backup-credential-contract.yaml region (2026-10-13T18:57:08Z)

credentials:
  - secret: weather-pg-backup-s3-writer-k3s
    namespace: weather
    role: writer
    bucket: weather-pg
    permissions: read-write
    consumed_by: deploy/k8s/database/object-store-local.yaml
    required_keys:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    provisioned:
      by: https://github.com/jvallery/storage-infra/issues/1253
      gate: agents change-gate garage target, operation create-private-bucket-and-scoped-keys
      change_id: weather-pg-availability-garage-1253
      garage_key_alias: weather-pg-backup-writer
      uid: 938194ab-1f1b-44a5-a633-04459926030f
      created_at: "2026-10-31T10:39:36Z"
      verified_green_at: "2026-10-31T10:39:46Z"
      labels_observed:
        - app.kubernetes.io/managed-by=garage-change-gate
        - garage-provision.vallery.net/bucket=weather-pg
        - garage-provision.vallery.net/change-id=weather-pg-availability-garage-1253
    observed:
      at: "2026-10-31T10:41:51Z"
      type: Opaque
      keys:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
      annotations: none
      change_id: weather-pg-availability-garage-1253

  - secret: weather-pg-backup-s3-reader-k3s
    namespace: weather
    role: reader
    bucket: weather-pg
    permissions: read-only
    # The restore drill reads the local catalog with this key only (storage-infra#1253 step 7,
    # not yet wired), so a drill cannot archive into s3://weather-pg/cnpg.
    consumed_by: null
    required_keys:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    provisioned:
      by: https://github.com/jvallery/storage-infra/issues/1253
      gate: agents change-gate garage target, operation create-private-bucket-and-scoped-keys
      change_id: weather-pg-availability-garage-1253
      garage_key_alias: weather-pg-backup-reader
      uid: dfa83879-b33c-43d2-8aa4-d718ec8245af
      created_at: "2026-10-31T10:39:36Z"
      verified_green_at: "2026-10-31T10:39:46Z"
      labels_observed:
        - app.kubernetes.io/managed-by=garage-change-gate
        - garage-provision.vallery.net/bucket=weather-pg
        - garage-provision.vallery.net/change-id=weather-pg-availability-garage-1253
    observed:
      at: "2026-10-31T10:41:51Z"
      type: Opaque
      keys:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
      annotations: none
      change_id: weather-pg-availability-garage-1253

# Functional probe the gate ran before confirm-green (no value read or printed).
functional_probe:
  at: "2026-10-31T10:39:46Z"
  result: pass
  checks:
    - anonymous request -> 403
    - reader GET ok, reader write denied
    - writer create, overwrite and delete ok
