# weather-pg WAL archive credential contract (weather#334).
#
# NOT A KUBERNETES MANIFEST. It has no apiVersion/kind and is absent from kustomization.yaml;
# app/tests/test_database_credential_contract.py asserts both. It is read by that test and by
# operators only.
#
# The two Garage credentials for the NAS-backed bucket `weather-pg-archive` were minted in the
# cluster on 2026-11-28 by the storage owner's Garage executor, which never emits key material.
# No plaintext value is in Git. CI holds no cluster credential, so it cannot see whether the
# Secret that object-store-archive.yaml selects exists or carries the keys it selects. Those
# facts are recorded here, dated, with the read-only probe that produced them, and the test
# refuses a store that selects a Secret or key this file does not attest. This is an
# ATTESTATION, not a proof.
#
# NEVER put a key VALUE in this file. Names, key names, UIDs, labels and dates only.
#
# HOW TO REFRESH THE OBSERVATION (read-only, metadata only)
#   for s in weather-pg-archive-s3-writer weather-pg-archive-s3-reader; do
#     kubectl --context vallery -n weather describe secret "$s"
#     kubectl --context vallery -n weather get secret "$s" \
#       -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,CREATED:.metadata.creationTimestamp
#   done
# `describe` prints the type, labels, annotations and each key's name and byte count, never
# a value. Never read a Secret with `-o yaml`, `-o json`, `jsonpath` or `go-template`: any
# of them can print `.data`, and a template error prints the whole object.

version: 1

# None known. The keys were minted inside the Garage pod and streamed into Secrets; the
# executor run printed no value.
exposures: []

# The region is not a credential and does not come from the Secret: the executor writes only
# the two key fields. object-store-archive.yaml supplies it through
# instanceSidecarConfiguration.env (AWS_DEFAULT_REGION and AWS_REGION), the same shape the
# retired store weather-pg-local used on the availability Garage.
region:
  value: garage
  source: object-store-archive.yaml spec.instanceSidecarConfiguration.env
  determined_at: "2026-11-28T06:58:00Z"
  method: garage-config-readback
  # Prints the one s3_region line only; never print the whole garage.toml.
  probe: >-
    kubectl --context vallery -n garage-hdd get configmap garage-hdd
    -o jsonpath='{.data.garage\.toml}' | grep -E '^[[:space:]]*s3_region'
  expected_output: s3_region = "garage"

credentials:
  - secret: weather-pg-archive-s3-writer
    namespace: weather
    role: writer
    bucket: weather-pg-archive
    permissions: read-write
    consumed_by: deploy/k8s/database/object-store-archive.yaml
    required_keys:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    provisioned:
      by: the storage owner (Garage executor)
      tool: storage-infra Garage executor
      change_id: r20261128t050315z-a3d914
      garage_key_alias: weather-pg-archive-writer
      uid: 5ed0f53a-706f-4b72-a03e-47c6adc1c9e8
      created_at: "2026-11-28T05:03:25Z"
      labels_observed:
        - app.kubernetes.io/managed-by=storage-infra-garage-executor
        - garage-provision.vallery.net/bucket=weather-pg-archive
        - storage.vallery.net/garage-run=r20261128t050315z-a3d914
    observed:
      at: "2026-11-28T06:54:43Z"
      type: Opaque
      keys:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
      annotations: none
      change_id: r20261128t050315z-a3d914

  - secret: weather-pg-archive-s3-reader
    namespace: weather
    role: reader
    bucket: weather-pg-archive
    permissions: read-only
    # The restore drill reads the archive with this key only, so a drill cannot archive into
    # s3://weather-pg-archive/cnpg.
    consumed_by: deploy/acceptance/restore/drill.yaml
    required_keys:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    provisioned:
      by: the storage owner (Garage executor)
      tool: storage-infra Garage executor
      change_id: r20261128t050315z-a3d914
      garage_key_alias: weather-pg-archive-reader
      uid: 74dea4e1-cc7c-438c-ae4f-9b040bb33380
      created_at: "2026-11-28T05:03:24Z"
      labels_observed:
        - app.kubernetes.io/managed-by=storage-infra-garage-executor
        - garage-provision.vallery.net/bucket=weather-pg-archive
        - storage.vallery.net/garage-run=r20261128t050315z-a3d914
    observed:
      at: "2026-11-28T06:54:43Z"
      type: Opaque
      keys:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
      annotations: none
      change_id: r20261128t050315z-a3d914

# Bucket permissions as the Garage bucket listing showed them (key ids omitted).
permissions_observed:
  at: "2026-11-28T06:56:00Z"
  probe: kubectl --context vallery -n garage-hdd exec garage-hdd-0 -c garage -- /garage bucket info weather-pg-archive
  result:
    - weather-pg-archive-writer RW
    - weather-pg-archive-reader R
    - object-custody-reader R

# The retired store weather-pg-local (bucket weather-pg on the availability Garage) still
# selects this writer, so its history stays restorable; nothing archives there since weather#334.
retired_credentials:
