apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: weather-pg-daily
  namespace: weather
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
spec:
  schedule: '0 15 9 * * *'
  backupOwnerReference: cluster
  cluster:
    name: weather-pg
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
