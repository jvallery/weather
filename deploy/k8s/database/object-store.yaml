apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: weather-pg-b2
  namespace: weather
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # storage-infra#2089: retired history store. No Cluster archives here since 2026-10-31 (last base
    # 2026-10-31T09:15:49Z, recoverable from 2026-10-24T17:50:19Z). It stays declared only so that
    # history can still be restored until its provider lifecycle expires it. The live offsite route
    # is the central B2 mirror of garage-k3s bucket weather-pg (storage-infra#2265).
    storage.vallery.net/lifecycle: retired-history
    storage.vallery.net/retired-since: "2026-10-31"
    storage.vallery.net/issue: jvallery/storage-infra#2089
spec:
  configuration:
    destinationPath: s3://weather-db-vallery/cnpg
    endpointURL: https://s3.us-west-000.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: weather-pg-backup-b2-writer
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: weather-pg-backup-b2-writer
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: weather-pg-backup-b2-writer
        key: AWS_REGION
    data:
      compression: gzip
      jobs: 1
    wal:
      compression: gzip
      maxParallel: 2
  # Omit retentionPolicy: v0.14.0 skips cloud pruning only for an empty policy.
  # B2 writeFiles still permits hide-by-name; no deleteFiles blocks version erasure.
  # The cnpg/ provider lifecycle alone schedules archive expiry (33d hide + 7d).
  instanceSidecarConfiguration:
    logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
