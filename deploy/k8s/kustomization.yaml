apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather
resources:
- namespace.yaml
- guardrails.yaml
- serviceaccounts.yaml
- network-policy.yaml
- application.yaml
- ingress.yaml
- editor-ingress.yaml
- database
- migrate
- scheduler
- capture
- receiver
- preview
- pipeline
# Search (#25): uncomment in the deploy commit that pins an app digest carrying weather.search.
components:
- search
images:
- name: weather-app
  newName: registry.vallery.net/jvallery/weather-app
  digest: sha256:3a573ef909648fbc87c35375462db42d11652a7c22a19d6bad7693b514dd7848
- name: weather-web
  newName: registry.vallery.net/jvallery/weather-web
  digest: sha256:f6e86dded1cac2a4a963a979e083f9f00ef1da9385409fbe4157e13f3568d1ec
# weather#223: one digest source. Each pipeline Deployment's WEATHER_IMAGE_DIGEST is
# copied from its own container image after the images transformer above resolves
# weather-app, so a pin PR that moves the weather-app digest cannot leave the env
# behind. deployments.yaml holds a placeholder that this replacement overwrites.
replacements:
- source:
    kind: Deployment
    name: pipeline-skycam-east
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-skycam-east
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
- source:
    kind: Deployment
    name: pipeline-skycam-west
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-skycam-west
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
- source:
    kind: Deployment
    name: pipeline-frontyard-1
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-frontyard-1
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
