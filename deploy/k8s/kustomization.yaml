apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather
resources:
- namespace.yaml
- guardrails.yaml
- serviceaccounts.yaml
- network-policy.yaml
- application.yaml
- ingress.yaml
- editor-ingress.yaml
- database
- migrate
- scheduler
- capture
- receiver
- preview
- pipeline
# Search (#25): uncomment in the deploy commit that pins an app digest carrying weather.search.
components:
- search
images:
- name: weather-app
  newName: registry.vallery.net/jvallery/weather-app
  digest: sha256:a412965788f25109c9185f15b1a3f84469c9c178548f521c9f1953448712ac4e
- name: weather-web
  newName: registry.vallery.net/jvallery/weather-web
  digest: sha256:370d82d8863f38e6f29141f49fb4f2c8a3518350810c795caadacfe389fc3943
# weather#223: one digest source. Each pipeline Deployment's WEATHER_IMAGE_DIGEST is
# copied from its own container image after the images transformer above resolves
# weather-app, so a pin PR that moves the weather-app digest cannot leave the env
# behind. deployments.yaml holds a placeholder that this replacement overwrites.
replacements:
- source:
    kind: Deployment
    name: pipeline-skycam-east
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-skycam-east
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
- source:
    kind: Deployment
    name: pipeline-skycam-west
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-skycam-west
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
- source:
    kind: Deployment
    name: pipeline-frontyard-1
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-frontyard-1
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
