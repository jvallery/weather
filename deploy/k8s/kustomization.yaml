apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather
resources:
- namespace.yaml
- guardrails.yaml
- serviceaccounts.yaml
- network-policy.yaml
- application.yaml
- ingress.yaml
- editor-ingress.yaml
- database
- migrate
- scheduler
- capture
- receiver
- preview
- pipeline
# Search (#25): uncomment in the deploy commit that pins an app digest carrying weather.search.
components:
- search
images:
- name: weather-app
  newName: registry.vallery.net/jvallery/weather-app
  digest: sha256:642cf59b3a7f8b4f2fc41fb4daca936a1da67a0d2c37bd0d9a4ac78858f5ff38
- name: weather-web
  newName: registry.vallery.net/jvallery/weather-web
  digest: sha256:f0ce0375772ba71ba1fb8841277db9d84613595e44e8f2c9fcc688c2efc796ca
# weather#223: one digest source. Each pipeline Deployment's WEATHER_IMAGE_DIGEST is
# copied from its own container image after the images transformer above resolves
# weather-app, so a pin PR that moves the weather-app digest cannot leave the env
# behind. deployments.yaml holds a placeholder that this replacement overwrites.
replacements:
- source:
    kind: Deployment
    name: pipeline-skycam-east
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-skycam-east
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
- source:
    kind: Deployment
    name: pipeline-skycam-west
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-skycam-west
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
- source:
    kind: Deployment
    name: pipeline-frontyard-1
    fieldPath: spec.template.spec.containers.[name=pipeline].image
    options:
      delimiter: '@'
      index: 1
  targets:
  - select:
      kind: Deployment
      name: pipeline-frontyard-1
    fieldPaths:
    - spec.template.spec.containers.[name=pipeline].env.[name=WEATHER_IMAGE_DIGEST].value
