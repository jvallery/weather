apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: weather-rate-limit
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  # Every request arrives through the Cloudflare tunnel, so the TCP peer is a
  # cloudflared pod. Key on the visitor's address instead (C7). LAN clients
  # that reach traefik-apps directly could spoof the header; that only lets
  # them evade their own limit.
  rateLimit:
    average: 30
    burst: 60
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: weather-media-in-flight
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  # Open media streams per visitor (#20). A player holds one or two ranges at a time;
  # each api pod also refuses more than 32 streams with a 503 before any body.
  inFlightReq:
    amount: 6
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: weather-security-headers
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: weather
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`weather.vallery.net`) && PathPrefix(`/api/`)
    priority: 100
    kind: Rule
    middlewares:
    - name: weather-rate-limit
    - name: weather-security-headers
    services:
    - name: api
      port: 80
  # Same-origin media and native downloads (#20), streamed by the api, never the web.
  - match: Host(`weather.vallery.net`) && (PathPrefix(`/media/`) || PathPrefix(`/downloads/`))
    priority: 100
    kind: Rule
    middlewares:
    - name: weather-rate-limit
    - name: weather-media-in-flight
    - name: weather-security-headers
    services:
    - name: api
      port: 80
  # Hashed, immutable build assets and fonts are not rate limited.
  - match: Host(`weather.vallery.net`) && (PathPrefix(`/assets/`) || PathPrefix(`/fonts/`))
    priority: 20
    kind: Rule
    middlewares:
    - name: weather-security-headers
    services:
    - name: web
      port: 80
  - match: Host(`weather.vallery.net`)
    priority: 10
    kind: Rule
    middlewares:
    - name: weather-rate-limit
    - name: weather-security-headers
    services:
    - name: web
      port: 80
  tls: {}
