apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: weather
  labels: &id001
    app.kubernetes.io/part-of: weather
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/name: scheduler
    weather.vallery.net/database-role: worker
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      # Estate PriorityClass ladder (weather#224).
      priorityClassName: estate-app
      enableServiceLinks: false
      automountServiceAccountToken: false
      serviceAccountName: scheduler
      imagePullSecrets:
      - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: scheduler
        image: weather-app
        command:
        - python
        - -m
        - weather.scheduler
        env:
        - name: DATABASE_CREDENTIAL_DIRECTORY
          value: /var/run/weather-db
        - name: METRICS_PORT
          value: '9000'
        # Private site for the frozen solar schedule (#15). The Secret is optional so the
        # scheduler starts without it; schedule jobs then fail visibly (see pipeline.md).
        - name: WEATHER_SITE_FILE
          value: /var/run/weather-site/site.json
        # #225: main-loop heartbeat file for the exec liveness probe (writable /tmp emptyDir).
        - name: SCHEDULER_HEARTBEAT_FILE
          value: /tmp/weather-scheduler-heartbeat
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: database
          mountPath: /var/run/weather-db
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: site
          mountPath: /var/run/weather-site
          readOnly: true
        ports:
        - name: metrics
          containerPort: 9000
        # #225: restart a hung main loop. The loop beats about every second when idle and every
        # 15 s while a job runs (job lease heartbeat); the longest legitimate gap is one tick or
        # outbox pass, each bounded by the database pool timeout (30 s). Stale after 300 s, three
        # failures 30 s apart: a hang restarts within about 6-7 minutes.
        livenessProbe:
          exec:
            command:
            - python
            - -I
            - -c
            - import os,sys,time; sys.exit(0 if time.time() - os.stat('/tmp/weather-scheduler-heartbeat').st_mtime < 300 else 1)
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: database
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: weather-pg-worker
              items:
              - key: username
                path: username
              - key: password
                path: password
          - secret:
              name: weather-pg-ca
              items:
              - key: ca.crt
                path: ca.crt
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: site
        secret:
          secretName: weather-site
          optional: true
          defaultMode: 288
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduler
  namespace: weather
  labels:
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
    app.kubernetes.io/part-of: weather
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: scheduler
      app.kubernetes.io/name: scheduler
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 9000
  egress:
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: weather-pg
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
