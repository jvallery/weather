# Excluded from the foundation kustomization. Commission only after the owner
# prerequisites and a restricted anonymous endpoint probe pass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-probe-egress
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: garage-change-gate
    matchExpressions:
      - key: garage-provision.vallery.net/change-id
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-apps
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        # Service HTTPS and its websecure target; concrete CNI enforcement must
        # be proved by the restricted probe before credentials are minted.
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8443}
