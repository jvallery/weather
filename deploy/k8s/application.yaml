apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: api
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.vallery.net/proxmox-host
              labelSelector:
                matchLabels: *id001
      containers:
      - name: api
        image: weather-app
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9000
        env:
        - name: PORT
          value: '8000'
        - name: METRICS_PORT
          value: '9000'
        - name: WEATHER_PUBLIC_ORIGIN
          value: https://weather.vallery.net
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - weather
        - api
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: weather
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: metrics
    port: 9000
    targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: api
---
