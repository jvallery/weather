apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: weather
  annotations:
    # After the wave-1 migrate hook; DB clients run at wave >= 2.
    argocd.argoproj.io/sync-wave: '2'
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: weather
        app.kubernetes.io/component: api
        # Admits egress to weather-pg (weather-database-clients NetworkPolicy).
        weather.vallery.net/database-role: api
    spec:
      serviceAccountName: api
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: zot-origin-cluster-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.vallery.net/proxmox-host
              labelSelector:
                matchLabels: *id001
      containers:
      - name: api
        image: weather-app
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9000
        # The private operator listener (#44): only traefik-apps may connect, and only the
        # weather-editor IngressRoute, behind Authentik forward-auth, routes to it.
        - name: operator
          containerPort: 8001
        env:
        - name: PORT
          value: '8000'
        - name: METRICS_PORT
          value: '9000'
        - name: OPERATOR_PORT
          value: '8001'
        - name: WEATHER_PUBLIC_ORIGIN
          value: https://weather.vallery.net
        # Media origin (#20): the weather-media reader key, mounted optionally below.
        - name: GARAGE_ENDPOINT
          value: https://s3-hdd.vallery.net
        - name: GARAGE_CREDENTIAL_DIRECTORY
          value: /var/run/weather-garage
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        # Startup and liveness never depend on the database; readiness does (#14), so a
        # database outage makes pods unready instead of restarting them.
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: database
          mountPath: /var/run/weather-db
          readOnly: true
        # weather_editor (#44), used only by the operator listener; the public listener keeps
        # the read-only weather_api role.
        - name: database-editor
          mountPath: /var/run/weather-db-editor
          readOnly: true
        - name: cursor
          mountPath: /var/run/weather-api-cursor
          readOnly: true
        # Private site position for derived almanac astronomy (#42); optional, so the API
        # starts and reports astronomy unavailable until agents KSOPS provides it.
        - name: site
          mountPath: /var/run/weather-site
          readOnly: true
        # Read-only weather-media key (storage-infra#1107); optional, so the API starts and
        # media GET answers 503 while the Secret is absent. Never the originals bucket.
        - name: garage-media
          mountPath: /var/run/weather-garage/weather-media
          readOnly: true
        command:
        - weather
        - api
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: database
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: weather-pg-api
              items:
              - key: username
                path: username
              - key: password
                path: password
          - secret:
              name: weather-pg-ca
              items:
              - key: ca.crt
                path: ca.crt
      - name: database-editor
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: weather-pg-editor
              items:
              - key: username
                path: username
              - key: password
                path: password
          - secret:
              name: weather-pg-ca
              items:
              - key: ca.crt
                path: ca.crt
      - name: cursor
        secret:
          secretName: weather-api-cursor
          defaultMode: 288
          items:
          - key: CURSOR_HMAC_KEY
            path: CURSOR_HMAC_KEY
      - name: site
        secret:
          secretName: weather-site
          optional: true
          defaultMode: 288
      - name: garage-media
        secret:
          secretName: weather-media-s3-reader
          optional: true
          defaultMode: 288
          items:
          - key: AWS_ACCESS_KEY_ID
            path: access_key_id
          - key: AWS_SECRET_ACCESS_KEY
            path: secret_access_key
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: weather
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: metrics
    port: 9000
    targetPort: metrics
---
# The operator listener alone (#44); the public api Service never exposes it.
apiVersion: v1
kind: Service
metadata:
  name: api-operator
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: weather
    app.kubernetes.io/component: api
  ports:
  - name: operator
    port: 8001
    targetPort: operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: api
---
