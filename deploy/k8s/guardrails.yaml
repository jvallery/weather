apiVersion: v1
kind: ResourceQuota
metadata:
  name: weather-budget
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  hard:
    requests.cpu: '12'
    requests.memory: 20Gi
    limits.cpu: '40'
    limits.memory: 64Gi
    requests.storage: 200Gi
    persistentvolumeclaims: '16'
    pods: '40'
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: weather-defaults
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: '1'
      memory: 512Mi
    max:
      cpu: '8'
      memory: 16Gi
