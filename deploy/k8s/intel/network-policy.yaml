# intel egress: CNPG and DNS come from weather-database-clients; this adds only Cortex
# (cortex.vallery.net) and Garage (s3-hdd.vallery.net), which both resolve to the traefik-apps
# VIP. Depending on where kube-router evaluates the translated connection it sees the VIP or a
# traefik pod, so admit both (the api-cortex-egress pattern). Ingress: metrics only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intel
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: intel
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 9000
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.7.10/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik-apps
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
