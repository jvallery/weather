# Binds the storage-infra#1106 PV (Retain, 300 GiB hard quota, soft NFS mount). tmp/ and
# sealed/ live on this one claim: the collector's seal is a same-filesystem rename.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weather-staging
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    app.kubernetes.io/component: capture
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: weather-staging
  volumeMode: Filesystem
  resources:
    requests:
      storage: 300Gi
