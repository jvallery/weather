# Collectors: no ingress except metrics from observability, and no egress here. The only
# egress each collector gets is its own camera, from collector-<camera>-egress (agents overlay).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector
  namespace: weather
  labels:
    app.kubernetes.io/part-of: weather
    agent-fleet.vallery.net/owner: jvallery
    agent-fleet.vallery.net/project: weather
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: weather
      app.kubernetes.io/component: collector
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 9000
