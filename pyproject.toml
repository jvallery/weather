# SPDX-License-Identifier: MIT
[project]
name = "vallery-weather"
version = "0.1.0"
description = "Public observational weather archive"
requires-python = ">=3.14.9,<3.15"
license = "MIT"
dependencies = [
  "fastapi==0.162.0", "starlette==1.9.0", "pydantic==2.14.1", "pydantic-core==2.50.1",
  "uvicorn==0.54.0", "asyncpg==0.32.0", "httpx2==2.16.0",
  "sqlalchemy==2.0.46", "alembic==1.18.4", "astral==3.2", "prometheus-client==0.24.1",
]

[project.scripts]
weather = "weather.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/weather"]

[dependency-groups]
dev = ["ruff==0.15.7", "mypy==1.19.1", "pytest==9.0.2", "pyyaml==6.0.3"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["weather"]
mypy_path = "app"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"
markers = ["integration: requires cluster-provided test services"]
